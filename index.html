<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iOS Safari zooms in when a text field under 16px gets focus, cropping the
      // preview while editing. maximum-scale=1 stops that auto-zoom; iOS ignores it
      // for pinch-zoom, so people can still zoom by hand. iOS only: on Android it
      // would block pinch-zoom.
      ;(function () {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        var m = ios && document.querySelector('meta[name=viewport]')
        if (m) m.setAttribute('content', m.getAttribute('content') + ', maximum-scale=1')
      })()
    </script>
    <meta name="theme-color" content="#141815" />
    <meta name="description" content="Edit local markdown files side by side with a live preview" />

    <!-- The manifest link is injected by vite-plugin-pwa at build time -->

    <title>Markdown Lab</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
